[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veyra-contracts"
version = "0.1.0"
description = "Shared typed contracts (tools, permissions, tasks, events, errors, memory, devices) for VEYRA. Phase 1 foundation."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
]

[tool.setuptools.packages.find]
include = ["veyra_contracts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
