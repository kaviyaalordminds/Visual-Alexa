[package]
name = "veyra-desktop"
version = "0.1.0"
description = "VEYRA desktop shell — hosts the React technical shell via the OS-native WebView. See docs/architecture/02-DESKTOP-ARCHITECTURE.md."
edition = "2021"
rust-version = "1.77"

[lib]
name = "veyra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Phase 10 P0-1 (docs/phase-10/RELEASE-READINESS.md): a packaged VEYRA.exe
# must start its own Local API backend — nothing else will. tauri-plugin-
# shell's sidecar mechanism is Tauri's documented way to bundle and spawn
# a companion executable (see scripts/build-backend-sidecar.py, which
# freezes services/local-api into that sidecar binary on Windows).
tauri-plugin-shell = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
