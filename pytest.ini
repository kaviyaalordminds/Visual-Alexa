[pytest]
testpaths = tests
asyncio_mode = auto
# app/db/session.py's `engine` (and the tool_registry/application_registry/
# orchestrator singletons built on top of it) is a module-level singleton
# created once at import time — safe only if every test shares the same
# event loop. pytest-asyncio's default is function-scoped, which silently
# reuses that engine's pooled aiosqlite connections across loops that get
# closed out from under them, causing real (not merely cosmetic) cross-test
# corruption: "database is locked", "Event loop is closed" from aiosqlite's
# worker thread, and even correct-looking calls returning wrong results.
# Session-scoping the loop so every test genuinely runs on the one loop the
# engine was created against is the actual fix.
asyncio_default_fixture_loop_scope = session
markers =
    real_computer_control_default: keep the real (off) computer_control.enabled seeded default instead of the test-convenience override — see tests/conftest.py
