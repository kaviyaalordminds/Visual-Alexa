[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veyra-voice"
version = "0.1.0"
description = "VEYRA's voice intelligence engine (Phase 5) — audio/STT/TTS/wake-word provider abstractions, language detection (English/Tamil/Tanglish), speech normalization, conversation state, and response generation. See docs/phase-5/PHASE-5-IMPLEMENTATION-PLAN.md."
requires-python = ">=3.11"
dependencies = [
    "veyra-contracts",
]

[project.optional-dependencies]
# Real (non-mock) audio I/O providers are lazy-imported and depend on
# these only when actually instantiated — see voice/providers/real.py.
# Never runtime-verified in this environment (no audio hardware exists
# here at all — docs/phase-5/PHASE-5-IMPLEMENTATION-PLAN.md §1).
audio = [
    "sounddevice>=0.5,<1",
]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
include = ["voice*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
