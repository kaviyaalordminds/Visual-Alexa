[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veyra-voice"
version = "0.1.0"
description = "VEYRA's voice intelligence engine (Phase 5) — audio/STT/TTS/wake-word provider abstractions, language detection (English/Tamil/Tanglish), speech normalization, conversation state, and response generation. See docs/phase-5/PHASE-5-IMPLEMENTATION-PLAN.md."
requires-python = ">=3.11"
dependencies = [
    "veyra-contracts",
]

[project.optional-dependencies]
# Real (non-mock) providers in voice/providers/real.py — each group only
# needed if that specific capability is configured (app/services/voice/
# register.py). Real microphone/speaker I/O cannot be exercised in this
# repo's own dev/CI sandbox (no audio hardware, no PortAudio library —
# confirmed live during development); wake-word/STT/TTS logic itself was
# live-verified here (docs/voice-hardware/SETUP.md).
audio = [
    "sounddevice>=0.5,<1",
]
# openWakeWord — local, offline wake-word detection (no cloud, no API
# key). Ships small pretrained ONNX models inside the package itself.
wake-word = [
    "openwakeword>=0.6,<1",
]
# pywhispercpp — local, offline speech-to-text via whisper.cpp bindings
# (no cloud, no API key). Downloads a real ggml model file on first use
# of a known model name; see docs/voice-hardware/SETUP.md.
stt = [
    "pywhispercpp>=1.5,<2",
]
# Piper — local, offline text-to-speech (no cloud, no API key). Needs a
# real voice .onnx file the operator downloads once; see
# docs/voice-hardware/SETUP.md.
tts = [
    "piper-tts>=1.7,<2",
]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
include = ["voice*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
