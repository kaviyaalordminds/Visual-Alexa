[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veyra-computer-control"
version = "0.1.0"
description = "VEYRA's local Windows computer-control engine (Phase 2) — application, window, UI Automation, filesystem, input, and screen capture backends behind platform-independent interfaces. See docs/phase-2/COMPUTER-CONTROL-DESIGN.md."
requires-python = ">=3.11"
dependencies = [
    "veyra-contracts",
    "psutil>=6,<8",
    "mss>=9,<11",
    "Pillow>=10,<12",
    # pywinauto and pywin32 are Windows-only and imported lazily inside
    # computer_control.windows — never imported at package-import time —
    # so this package installs and imports cleanly on non-Windows hosts.
    # See docs/phase-2/PHASE-2-IMPLEMENTATION-PLAN.md §2 and §4.
    "pywinauto>=0.6.8,<1; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
include = ["computer_control*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
