[alembic]
# %(here)s = this ini file's own directory (database/) — never the
# process's cwd. Plain "migrations" resolved against cwd instead, which
# is exactly the same class of bug database_url had: `alembic -c
# database/alembic.ini ...` invoked from the repo root (or anywhere but
# `database/` itself) would fail with "Path doesn't exist: migrations."
script_location = %(here)s/migrations
prepend_sys_path = .
# This value is always overridden at runtime by migrations/env.py, which
# reads the Local API's own app.core.config.Settings.database_url (an
# absolute, cwd-independent path — see that file's own comment) so
# Alembic and the running app can never target two different SQLite
# files. Kept here only as the offline-mode fallback / a readable
# default for `alembic` invoked with no env.py override.
sqlalchemy.url = sqlite+aiosqlite:///./veyra.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
